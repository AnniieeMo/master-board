<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER·BOARD // 硕士课程工作台</title>
<link rel="stylesheet" href="assets/pixel/Fusion-Pixel-12px-Monospaced-Simplified-Chinese.css">
<style>
:root{
  --bg:#e9e3d3;
  --panel:#f7f2e4;
  --panel2:#fffdf4;
  --ink:#33312a;
  --line:#ddd5c0;
  --line-dash:#b3aa90;
  --green:#2f7d3c;
  --green-dim:#7d9b80;
  --amber:#b9791f;
  --red:#c24334;
  --cyan:#2f7a8f;
  --text:#3c3a32;
  --dim:#8f8871;
  --shadow:rgba(51,49,42,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(rgba(51,49,42,.07) 1px,transparent 1.4px);
  background-size:10px 10px;
  color:var(--text);
  font-family:"Fusion Pixel 12px Monospaced Simplified Chinese","SF Mono",Menlo,Consolas,"Courier New",monospace;
  font-size:13px;line-height:1.6;
}
::selection{background:var(--amber);color:#fff}
.wrap{max-width:1140px;margin:0 auto;padding:22px 18px 48px}

.hdr{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap;gap:6px}
.logo{color:var(--ink);font-size:16px;letter-spacing:2px}
.logo .sq{color:var(--red)}
.hdr .sub{color:var(--dim);font-size:11px;margin-left:10px;letter-spacing:1px}
.clock{color:var(--ink);font-size:12px;letter-spacing:1px}
.cursor{display:inline-block;color:var(--red);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.panel{border:2px solid var(--ink);background:var(--panel);box-shadow:4px 4px 0 var(--shadow);margin-bottom:16px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-bottom:2px solid var(--ink);background:var(--panel2);color:var(--ink);font-size:11px;letter-spacing:1px}
.ph .lead{color:var(--green)}
.ph .r{color:var(--dim);letter-spacing:0}
.pb{padding:12px}

.today-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.today-meta{color:var(--dim)}
.today-meta b{color:var(--amber);font-weight:normal}

.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--panel2);padding:2px 9px;font-size:12px;white-space:nowrap;box-shadow:2px 2px 0 var(--shadow)}
.chip .t{color:var(--cyan)}
.chip .r2{color:var(--dim)}
.chip.now{border-color:var(--amber);animation:pulse 1.6s infinite}
.chip.now .t{color:var(--amber)}
@keyframes pulse{0%,100%{box-shadow:2px 2px 0 rgba(185,121,31,.75)}50%{box-shadow:2px 2px 0 rgba(185,121,31,.12)}}

.main-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.side-grid{display:grid;gap:16px}

.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kcol{border:2px dashed var(--line-dash);min-height:180px;padding:8px}
.kcol-h{color:var(--dim);font-size:10px;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between}
.kcol-h .n{color:var(--ink)}
.kcol.doing .kcol-h{color:var(--amber)}

.card{border:2px solid var(--ink);background:var(--panel2);padding:9px 10px;margin-bottom:8px;box-shadow:3px 3px 0 var(--shadow);transition:transform .05s,box-shadow .05s}
.card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.card:last-child{margin-bottom:0}
.card.st-doing{background:#fbf0da;border-color:var(--amber);box-shadow:3px 3px 0 rgba(185,121,31,.28)}
.card.st-done{opacity:.6;background:#efeadd;border-color:var(--line-dash);box-shadow:none}
.card.st-done .card-title{text-decoration:line-through}
.card-top{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:4px}
.tag{font-size:10px;padding:0 6px;border:2px solid;letter-spacing:0;background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.tag.c-green{color:var(--green);border-color:var(--green)}
.tag.c-amber{color:var(--amber);border-color:var(--amber)}
.tag.c-cyan{color:var(--cyan);border-color:var(--cyan)}
.cd{font-size:11px;white-space:nowrap}
.cd.ok{color:var(--green)}
.cd.warn{color:var(--amber)}
.cd.late{color:var(--red);animation:blink 1.2s steps(1) infinite}
.card-title{font-size:13px;color:var(--ink)}
.card-due{font-size:11px;color:var(--dim);margin-top:2px}
.card-note{font-size:11px;color:var(--green-dim);margin-top:3px;border-left:3px solid var(--line-dash);padding-left:7px}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:22px 0;letter-spacing:2px}

.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{border:2px solid var(--ink);background:var(--panel);color:var(--dim);font-family:inherit;font-size:12px;letter-spacing:1px;padding:4px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .05s,box-shadow .05s}
.tab:hover{color:var(--ink);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--shadow)}
.tab.active{background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--shadow)}

.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-day{border:2px solid var(--line-dash);padding:9px 10px;background:var(--panel2)}
.plan-day.today{border-color:var(--amber);background:#f8eed8}
.plan-day-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.plan-day-h b{color:var(--ink);font-weight:normal}
.plan-load{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.load-track{width:60px;height:8px;border:2px solid var(--line-dash);background:var(--panel)}
.load-fill{height:100%;background:var(--green)}
.load-fill.hot{background:var(--amber)}
.load-fill.full{background:var(--red)}
.plan-fixed,.plan-blocks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.plan-blocks:empty,.plan-fixed:empty{display:none}
.chip.sm{font-size:10px;padding:1px 6px;box-shadow:1px 1px 0 var(--shadow)}
.chip.class{border-color:var(--cyan)}
.chip.class .t{color:var(--cyan)}
.chip.meeting{border-color:var(--green)}
.chip.meeting .t{color:var(--green)}
.chip.study{border-color:var(--amber)}
.chip.study .t{color:var(--amber)}
.plan-warn{font-size:10px;color:var(--red);margin-top:2px}
.plan-warn:empty{display:none}
.plan-label{font-size:10px;color:var(--dim);letter-spacing:1px;margin:4px 0 3px}

.week-row{display:flex;gap:10px;padding:6px 8px;border-left:4px solid transparent;align-items:baseline}
.week-row.today{border-left-color:var(--amber);background:#f8eed8}
.week-day{width:34px;color:var(--dim);font-size:11px;flex-shrink:0}
.week-row.today .week-day{color:var(--amber)}
.week-courses{display:flex;flex-wrap:wrap;gap:6px}

.exam-row{display:flex;gap:10px;align-items:baseline;padding:5px 2px;border-bottom:2px dotted var(--line);font-size:12px;flex-wrap:wrap}
.exam-row:last-child{border-bottom:0}
.exam-d{color:var(--amber);white-space:nowrap;font-size:11px}
.exam-n{flex:1;min-width:120px}

.todo-row{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;border-bottom:2px dotted var(--line);font-size:12px}
.todo-row:last-child{border-bottom:0}
.todo-row.done-item .tt{text-decoration:line-through;color:var(--dim)}
.todo-row .tt{flex:1;word-break:break-all}
.todo-row .done-mark{color:var(--green);font-size:10px;white-space:nowrap}

.footer{margin-top:6px;color:var(--dim);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.prog{display:flex;gap:2px;align-items:center}
.prog .cell{width:8px;height:12px;border:2px solid var(--line-dash)}
.prog .cell.f{background:var(--green);border-color:var(--green)}
.prog .cell.c{background:var(--amber);border-color:var(--amber)}

@media (max-width:920px){
  .main-grid{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
  .kcol{min-height:auto}
  .plan-grid{grid-template-columns:1fr}
}
</style>
</head>

<div class="wrap">

  <div class="hdr">
    <div><span class="logo">▛▞ MASTER<span class="sq">·</span>BOARD</span><span class="sub">硕士课程工作台 // PIXEL CONSOLE v2</span></div>
    <div class="clock"><span id="clock">----/--/-- --:--:--</span><span class="cursor">▊</span></div>

  <div class="tabs">
    <button class="tab active" data-view="board">▚ BOARD // 看板</button>
    <button class="tab" data-view="plan">▚ PLAN // 排期</button>

  <div class="main-grid">

        <div class="ph"><span><span class="lead">■</span> EXAMS // 考试日程</span></div>
        <div class="pb" id="examBody"></div>
      </div>
      <div class="panel">

      </div>
    </div>
  </div>
  </div>

  <div id="view-plan" style="display:none">

      <div class="ph"><span><span class="lead">■</span> PLAN // 排期引擎</span><span class="r" id="planMeta"></span></div>
      <div class="pb"><div class="plan-grid" id="planBody"></div></div>
    </div>
  </div>

  <div class="footer">
    <span id="semProg"></span>
    <span><button class="btn" id="btnExport">导出备份</button></span>
    <span>有新作业/改状态 → 告诉 opencode · 我更新 data.json 并自动发布到所有设备</span>
  </div>

</div>

<script>
const DATA = JSON.parse(document.getElementById("board-data").textContent);
const PLANNING = JSON.parse(document.getElementById("planning-data").textContent);
const WD = ["日","一","二","三","四","五","六"];
const DAYN = {1:"周一",2:"周二",3:"周三",4:"周四",5:"周五",6:"周六",7:"周日"};

function courseOf(name){
  return (DATA.courses||[]).find(c => c.name === name);
}
function tagHtml(name){
  const c = courseOf(name);
  const cls = c ? ("c-" + (c.color||"green")) : "c-green";
  return '<span class="tag ' + cls + '">' + name + '</span>';
}
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function fmtDue(due){
  const d = new Date(due);
  return pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + WD[d.getDay()] + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function cdInfo(due){
  const ms = new Date(due) - new Date();
  if(ms <= 0){
    const dd = Math.floor(-ms / 864e5);
    return { t: dd >= 1 ? "已逾期 " + dd + " 天" : "已逾期", cls: "late" };
  }
  const d = Math.floor(ms / 864e5);
  const h = Math.floor(ms % 864e5 / 36e5);
  const m = Math.floor(ms % 36e5 / 6e4);
  let t, cls;
  if(ms < 864e5){ t = h + "时" + m + "分"; cls = "late"; }
  else if(d <= 3){ t = d + "天" + h + "时"; cls = "warn"; }
  else { t = d + " 天"; cls = "ok"; }
  return { t: "剩 " + t, cls };
}

function semesterWeek(){
  const [y,m,d] = DATA.semester.start.split("-").map(Number);
  const s = new Date(y, m-1, d);
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const w = Math.floor((t0 - s) / (7 * 864e5)) + 1;
  return w;
}

function renderToday(){
  const now = new Date();
  const jsDay = now.getDay() === 0 ? 7 : now.getDay();
  const w = semesterWeek();
  const inSem = w >= 1 && w <= DATA.semester.weeks;
  document.getElementById("weekTag").textContent =
    w < 1 ? "未开学" : (w > DATA.semester.weeks ? "假期中" : "第 " + w + " 周 / 共 " + DATA.semester.weeks + " 周");
  const today = (DATA.courses||[]).filter(c => c.day === jsDay);
  let h = "";
  h += '<span class="today-meta">' + now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate()) + " 周" + WD[now.getDay()] + "</span>";
  if(!inSem){
    h += '<span class="today-meta">· 当前不在教学周内</span>';
  } else if(today.length === 0){
    h += '<span class="today-meta">· 今日 <b>无课</b> ▸ 自习/休息</span>';
  } else {
    h += '<span class="today-meta">· 今日 <b>' + today.length + '</b> 门课：</span>';
    today.forEach(c => {
      const s = c.start.replace(":",""), e = c.end.replace(":","");
      const isNow = (now.getHours()*100+now.getMinutes()) >= +s && (now.getHours()*100+now.getMinutes()) < +e;
      h += '<span class="chip' + (isNow ? " now" : "") + '"><span class="t">' + c.start + "-" + c.end + "</span>" + c.name + '<span class="r2">@' + c.room + "</span>" + (isNow ? " · 进行中" : "") + "</span>";
    });
  }
  document.getElementById("todayBody").innerHTML = h;
}

function renderWeek(){
  let h = "";
  for(let d = 1; d <= 7; d++){
    const now = new Date();
    const jsDay = now.getDay() === 0 ? 7 : now.getDay();
    const list = (DATA.courses||[]).filter(c => c.day === d);
    h += '<div class="week-row' + (d === jsDay ? " today" : "") + '">';
    h += '<span class="week-day">' + DAYN[d] + "</span>";
    h += '<span class="week-courses">';
    if(list.length === 0){ h += '<span class="week-day">—</span>'; }
    list.forEach(c => {
      h += '<span class="chip"><span class="t">' + c.start + "-" + c.end + "</span>" + c.name + '<span class="r2">@' + c.room + "</span></span>";
    });
    h += "</span></div>";
  }
  h += '<div style="color:var(--dim);font-size:10px;margin-top:6px;letter-spacing:1px">' + (DATA.semester.note || "") + "</div>";
  document.getElementById("weekBody").innerHTML = h;
}

function renderKanban(){
  const cols = {
    todo: { cls: "", label: "TODO // 待办", list: [] },
    doing: { cls: "doing", label: "DOING // 进行中", list: [] },
    done: { cls: "done", label: "DONE // 已完成", list: [] }
  };
  (DATA.tasks||[]).filter(t => t.kind === "homework").forEach(t => {
    (cols[t.status] || cols.todo).list.push(t);
  });
  let h = "";
  for(const k of ["todo","doing","done"]){
    const c = cols[k];
    c.list.sort((a,b) => new Date(a.due||0) - new Date(b.due||0));
    h += '<div class="kcol ' + c.cls + '"><div class="kcol-h"><span>' + c.label + '</span><span class="n">' + c.list.length + "</span></div>";
    if(c.list.length === 0){ h += '<div class="empty">· 空闲 ·</div>'; }
    c.list.forEach(t => {
      const cd = cdInfo(t.due);
      h += '<div class="card st-' + t.status + '">'
        + '<div class="card-top">' + tagHtml(t.course) + '<span class="cd ' + cd.cls + '">' + (t.status === "done" ? "✔ 已完成" : cd.t) + "</span></div>"
        + '<div class="card-title">' + t.title + "</div>"
        + '<div class="card-due">DUE ' + fmtDue(t.due) + "</div>"
        + (t.notes ? '<div class="card-note">' + t.notes + "</div>" : "")
        + "</div>";
    });
    h += "</div>";
  }
  document.getElementById("kanban").innerHTML = h;
}

function renderExams(){
  const list = (DATA.tasks||[]).filter(t => t.kind === "exam").sort((a,b) => new Date(a.due) - new Date(b.due));
  let h = "";
  list.forEach(t => {
    const cd = cdInfo(t.due);
    h += '<div class="exam-row"><span class="exam-d">' + fmtDue(t.due).slice(0,6) + "</span><span class='exam-n'>" + t.course + " · " + t.title + "</span><span class='cd " + cd.cls + "'>" + cd.t + "</span></div>";
  });
  if(list.length === 0) h = '<div class="empty">· 暂无考试 ·</div>';
  document.getElementById("examBody").innerHTML = h;
}

function renderAdhoc(){
  const list = (DATA.tasks||[]).filter(t => t.kind === "adhoc").sort((a,b) => (a.status==="done"?1:0)-(b.status==="done"?1:0) || new Date(a.due||0) - new Date(b.due||0));
  let h = "";
  list.forEach(t => {
    const done = t.status === "done";
    let duePart = "";
    if(t.due){
      const cd = cdInfo(t.due);
      duePart = '<span class="cd ' + cd.cls + '">' + fmtDue(t.due).slice(0,6) + " " + cd.t + "</span>";
    }
    const mark = done ? '<span class="done-mark">✔ 完成</span>' : "";
    h += '<div class="todo-row' + (done ? " done-item" : "") + '">'
      + '<span class="tt">' + t.title + (t.notes ? ' <span style="color:var(--dim)">· ' + t.notes + "</span>" : "") + "</span>"
      + duePart
      + mark + "</div>";
  });
  if(list.length === 0) h = '<div class="empty">· 空闲 · 没有临时事项 ·</div>';
  document.getElementById("adhocBody").innerHTML = h;
}

function renderFooter(){
  const w = semesterWeek();
  const total = DATA.semester.weeks;
  let cells = "";
  for(let i = 1; i <= total; i++){
    const cls = i < w ? "f" : (i === w && w <= total ? "c" : "");
    cells += '<span class="cell ' + cls + '"></span>';
  }
  const pct = Math.max(0, Math.min(100, Math.round(w / total * 100)));
  document.getElementById("semProg").innerHTML =
    '<span class="prog">' + cells + '</span> 学期进度 ' + (w >= 1 && w <= total ? pct + "%" : "—");
}

function renderAll(){
  renderToday();
  renderWeek();
  renderKanban();
  renderExams();
  renderAdhoc();
  renderFooter();
  renderPlan();
}

function tickClock(){
  const n = new Date();
  document.getElementById("clock").textContent =
    n.getFullYear() + "-" + pad(n.getMonth()+1) + "-" + pad(n.getDate()) + " " + WD[n.getDay()].toUpperCase() + " " + pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds());
}

document.getElementById("btnExport").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), rev: DATA.rev, tasks: DATA.tasks }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "master-board-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

function renderPlan(){
  document.getElementById("planMeta").textContent =
    PLANNING.days && PLANNING.days.length
      ? "生成于 " + (PLANNING.generated_at||"").slice(0,16).replace("T"," ") + " · 日历" + (PLANNING.calendar_sync && PLANNING.calendar_sync.status === "available" ? "已同步 " + PLANNING.calendar_sync.imported + " 条" : "未同步·用课表兜底")
      : "尚未生成 · 让 agent 运行 python3 plan.py";
  const body = document.getElementById("planBody");
  if(!PLANNING.days || !PLANNING.days.length){
    body.innerHTML = '<div class="empty" style="grid-column:1/-1">· 排期为空 · 运行 python3 plan.py 生成 ·</div>';
    return;
  }
  const todayIso = new Date().toISOString().slice(0,10);
  const todayLocal = new Date();
  const localIso = todayLocal.getFullYear() + "-" + pad(todayLocal.getMonth()+1) + "-" + pad(todayLocal.getDate());
  let h = "";
  PLANNING.days.forEach(d => {
    const pct = Math.min(100, Math.round((d.load_minutes||0) / (d.capacity_minutes||1) * 100));
    const loadCls = pct >= 90 ? "full" : pct >= 60 ? "hot" : "";
    h += '<div class="plan-day' + (d.date === localIso ? " today" : "") + '">'
      + '<div class="plan-day-h"><b>' + d.date.slice(5) + " " + d.weekday + "</b>"
      + '<span class="plan-load"><span class="load-track"><span class="load-fill ' + loadCls + '" style="width:' + pct + '%"></span></span>' + (d.load_minutes||0) + "/" + d.capacity_minutes + "分</span></div>";
    if(d.fixed && d.fixed.length){
      h += '<div class="plan-fixed">';
      d.fixed.forEach(b => {
        h += '<span class="chip sm ' + (b.type||"class") + '"><span class="t">' + b.start + "-" + b.end + "</span>" + b.title + "</span>";
      });
      h += "</div>";
    }
    if(d.blocks && d.blocks.length){
      h += '<div class="plan-label">▸ 建议学习块</div><div class="plan-blocks">';
      d.blocks.forEach(b => {
        h += '<span class="chip sm study"><span class="t">' + b.start + "-" + b.end + "</span>" + b.title + '<span class="r2">' + b.course + "</span></span>";
      });
      h += "</div>";
    } else if(!d.fixed || !d.fixed.length){
      h += '<div class="plan-label">▸ 自由日 · 无固定安排</div>';
    }
    if(d.warnings && d.warnings.length){
      h += '<div class="plan-warn">⚠ ' + d.warnings.join("；") + "</div>";
    }
    h += "</div>";
  });
  body.innerHTML = h;
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("view-board").style.display = tab.dataset.view === "board" ? "" : "none";
    document.getElementById("view-plan").style.display = tab.dataset.view === "plan" ? "" : "none";
  });
});

tickClock();
setInterval(tickClock, 1000);
setInterval(renderAll, 30000);
renderAll();
</script>
</body>
</html>
